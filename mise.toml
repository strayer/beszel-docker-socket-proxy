[tools]
go = "1.27.3"
"go:golang.org/x/tools/cmd/goimports" = "0.47.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.5.0"
golangci-lint = "2.15.0"

[tasks.format]
description = "Format Go source"
run = "goimports -w ."

[tasks.format-check]
description = "Require goimports-clean source"
run = "test -z \"$(goimports -l .)\""

[tasks.test]
description = "Run unit tests"
run = "go test -race -cover ./..."

[tasks.lint]
description = "Run static checks"
depends = ["format-check"]
run = ["go vet ./... && go vet -tags e2e ./e2e", "golangci-lint run --build-tags e2e", "govulncheck ./..."]

[tasks.e2e]
description = "Run the e2e suite against PROXY_IMAGE (build it first, see README)"
run = "go test ./e2e -tags e2e -v"
